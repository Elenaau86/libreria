          - accepted_values:
              values: ['Bolsillo', 'Ebook', 'Tapa blanda', 'Tapa dura']

      - name: num_titulos
        description: "Número de títulos con este formato en el catálogo."
        tests: [not_null]

      - name: precio_pvp_medio
        description: "Precio PVP medio en € de todos los títulos con este formato."
        tests: [not_null]