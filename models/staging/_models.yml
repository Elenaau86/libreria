                - 'Crítica'
                - 'Destino'
                - 'Ediciones B'
                - 'Espasa'
                - 'Paidós'
                - 'Penguin Clásicos'
                - 'Planeta'
                - 'Random House'
                - 'Salamandra'
                - 'Siruela'
                - 'Tusquets'
      
  - name: num_titulos
    description: "Número de títulos publicados por esta editorial en el catálogo."
    tests: [not_null]
  
  # ─────────────────────────────────────────────────────────────────
  # STG__CATEGORIAS
  # ─────────────────────────────────────────────────────────────────
  - name: stg__categorias
    description: >
      Catálogo de categorías únicas con métricas agregadas de precio y margen.
      10 categorías únicas. Generado con SELECT DISTINCT desde stg__catalogo_productos.
      Incluye precio medio y margen medio por categoría como métricas de referencia.
    columns:
      - name: categoria
        description: "Nombre de la categoría. Clave natural única. 10 valores posibles."
        tests:
          - unique
          - not_null
          - accepted_values:
              values:
                - 'Arte y Fotografía'
                - 'Autoayuda'
                - 'Ciencia y Tecnología'
                - 'Cómics/Manga'
                - 'Economía/Negocios'
                - 'Ficción'
                - 'Historia'
                - 'Idiomas'
                - 'Infantil/Juvenil'
                - 'No Ficción'
     
      - name: num_titulos
        description: "Número de títulos pertenecientes a esta categoría en el catálogo."
        tests: [not_null]

      - name: precio_pvp_medio
        description: "Precio PVP medio en € de todos los títulos de la categoría. Arte y Fotografía tiene el más alto (51,43 €), Cómics/Manga el más bajo (12,35 €)."
        tests: [not_null]

      - name: margen_medio_pct
        description: "Margen bruto medio en % de todos los títulos de la categoría."
        tests: [not_null]


  # ─────────────────────────────────────────────────────────────────
  # STG__IDIOMAS
  # ─────────────────────────────────────────────────────────────────
  - name: stg__idiomas
    description: >
      Catálogo de idiomas únicos extraído del catálogo de productos.
      6 idiomas únicos. Generado con SELECT DISTINCT desde stg__catalogo_productos.
    columns:
      - name: idioma
        description: "Nombre del idioma. Clave natural única. 6 valores posibles."
        tests:
          - unique
          - not_null
          - accepted_values:
              values: ['Alemán', 'Catalán', 'Español', 'Euskera', 'Gallego', 'Inglés']

      - name: num_titulos
        description: "Número de títulos en este idioma en el catálogo."
        tests: [not_null]


  # ─────────────────────────────────────────────────────────────────
  # STG__FORMATOS
  # ─────────────────────────────────────────────────────────────────
  - name: stg__formatos
    description: >
      Catálogo de formatos únicos con precio medio por formato.
      4 formatos únicos. Generado con SELECT DISTINCT desde stg__catalogo_productos.
      Distribución: Tapa blanda (266), Tapa dura (147), Bolsillo (71), Ebook (16).
    columns:
      - name: formato
        description: "Nombre del formato. Clave natural única. 4 valores posibles."
        tests:
          - unique
